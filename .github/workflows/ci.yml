name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret scan
        run: npm run scan:secrets
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Web build
        run: npm run build -w @portchimera/web
        env:
          # Public placeholders so the build does not need real project values.
          VITE_API_URL: https://example.invalid
          VITE_SUPABASE_URL: https://example.supabase.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder
